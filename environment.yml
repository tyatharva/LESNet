name: LESNet
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pillow
  - cartopy
  - python-cdo
  - dominate
  - einops
  - herbie-data
  - matplotlib
  - metpy
  - numpy
  - pandas
  - piq
  - pysteps
  - requests
  - scipy
  - seaborn
  - timm
  - pytorch
  - torchvision
  - tqdm
  - xarray
  - zarr
prefix: /path/to//LESNet

# You also need pywgrib2_s
# Instructions can be found here:
# https://www.cpc.ncep.noaa.gov/products/wesley/wgrib2/pywgrib2_s_install.html
