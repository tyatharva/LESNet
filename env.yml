name: LESNet
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pillow
  - netCDF4
  - cdo
  - python-cdo
  - cartopy
  - dominate
  - einops
  - herbie-data
  - matplotlib
  - metpy
  - numpy
  - pandas
  - piq
  - pysteps
  - requests
  - scipy
  - seaborn
  - timm
  - pytorch
  - torchvision
  - xarray
  - dask
  - tqdm
  - zarr

# You also need pywgrib2_s
# Instructions can be found here:
# https://www.cpc.ncep.noaa.gov/products/wesley/wgrib2/pywgrib2_s_install.html
# Once installed, copy pwgrib2_s.py to the site-packages folder of the environment
